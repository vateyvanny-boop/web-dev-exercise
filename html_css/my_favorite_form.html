<!DOCTYPE html>
<html lang="km">
 <head>
  <meta charset="UTS-8">
  <title>Add A New Place </title>
  <link rel="stylesheet" href="my_favorite_form.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
 </head>
 <body>
    <main class="container">
        <h1>★★★Add A New Place★★★</h1>
        <form action="#" method="post" class="card">
            <div class="form-row">
                <label for="Place">Place</label>
                <input type="text" name="Place" id="Place" required placeholder="Borko" />
                <small class="hint ">please enter Place</small>
                
            </div>
            <div class="form-row">
                <label for="Reason">Reason</label>
                <textarea id="Reason" name="Reason" rows="5" placeholder="please enter Reason" required></textarea>
                
            </div>


            <fieldset class="form-row">
                <legend>Best season</legend>
                <div class="radios">
                    <label><input type="radio" name="Best-season"value="rainy"/> rainy</label>
                    <label><input type="radio" name="Best-season"value="summer"/> summer</label>
                    
                </div>
                
            </fieldset>
            <div class="form-row">
                <label for="provice">provice</label>
                <select id="provice" name="provice"required>
                <option value="" selected disabled>choose a provice</option>
                <option>Takev</option>
                <option>kompot</option>
                <option>koh kong</option>
                <option>Siem reap</option> 
                    
                </select>
                
            </div>

            <div class="form-row">
                <label for="input-date">input date</label>
                <input type="date" id="input-date"name="input-date">
            </div>
            <div class="actions">
                <button type="submit">save</button>
                <button type="reset"class="secondary">clear</button>
                
            </div>
        </form>
    </main>
</body>
 </html>
